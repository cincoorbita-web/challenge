<title>Base Lunar</title>
<style>
:root{color-scheme:dark;--bg:#05070f;--c:#e6ecff;--m:#a9b8da;--ac:#4d8dff;--ln:#2a3b66;box-sizing:border-box}
html,body{height:100%}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--c);font-family:system-ui,sans-serif;min-height:100vh;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#bgi{position:fixed;inset:0;z-index:0;overflow:hidden;background:#000}
#bgi img{width:100%;height:100%;object-fit:cover;object-position:center bottom;animation:kb 32s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.03)}to{transform:scale(1.16) translate(-2.5%,-1.5%)}}
#bgi:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.35),rgba(0,0,0,0) 40%,rgba(0,0,0,.55))}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;-webkit-mask-image:linear-gradient(to bottom,#000 30%,transparent 62%);mask-image:linear-gradient(to bottom,#000 30%,transparent 62%)}
body.ing #bgi,body.ing #bg{display:none}
#wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:10px}
.card{background:rgba(10,16,34,.74);backdrop-filter:blur(6px);border:1px solid var(--ln);border-radius:16px;padding:18px;margin-bottom:12px}
h1{font-size:clamp(2rem,7vw,3.2rem);text-shadow:0 0 24px #4d8dff}h2{font-size:1.15rem;margin-bottom:8px}
p,.sub{color:var(--m);line-height:1.55;font-size:.92rem}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--ln);background:#080d19;color:var(--c);font-size:1rem;margin:6px 0 10px}
button{cursor:pointer;font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 18px;background:var(--ac);color:#fff}
button:active{transform:scale(.96)}button.g{background:#141d31;border:1px solid var(--ln);color:var(--c)}button:disabled{opacity:.4}
#err{color:#ff8fa3;font-size:.9rem;min-height:1.2em;margin-bottom:8px}
.fila{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.cs{display:flex;gap:12px;align-items:center}.cs>div:first-child{flex:1;min-width:0}
#pvw,#pw{display:block;width:200px;height:246px;max-width:70%;margin:4px auto}
#sw{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.sw{width:36px;height:36px;border-radius:50%;padding:0;border:3px solid transparent}.sw.on{border-color:#fff;box-shadow:0 0 12px #fff}
#juego{display:none;position:fixed;inset:0;z-index:2;background:#02040a;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
#main{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#cv{display:block;border-radius:8px;touch-action:none;background:#03060e}
#ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(3,6,14,.88);text-align:center;padding:14px;overflow:auto;z-index:3}
#ov.on{display:flex}#ov .big{font-size:2.4rem}#ov h2{font-size:1.4rem}#ov p{max-width:560px}
#ov .fila button{min-width:210px}#ov{justify-content:flex-start}#ov>:first-child{margin-top:auto}#ov>:last-child{margin-bottom:auto}#ox{max-height:calc(100vh - 240px);min-height:110px;overflow-y:auto;padding-right:12px;scrollbar-width:thin;scrollbar-color:#4d8dff #0a1022}#ox::-webkit-scrollbar{width:8px}#ox::-webkit-scrollbar-thumb{background:#4d8dff;border-radius:6px}#ox::-webkit-scrollbar-track{background:#0a1022;border-radius:6px}
#bp{position:absolute;top:8px;right:8px;z-index:4;padding:8px 14px;font-size:1.1rem}
#rot{display:none;position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(10,16,34,.85);border:1px solid var(--ln);border-radius:20px;padding:6px 14px;font-size:.8rem;color:#ffd27a;pointer-events:none;z-index:2;white-space:nowrap}
#tac{display:none;gap:6px;padding:6px 8px;width:100%;justify-content:space-between;align-items:center}
.gp{display:flex;gap:8px}
#tac button{flex:none;width:58px;height:58px;padding:0;font-size:1.3rem;border-radius:50%;background:#141d31;border:1px solid var(--ln);user-select:none;-webkit-user-select:none;touch-action:none}
@media(hover:none) and (pointer:coarse){#tac{display:flex}}
@media(orientation:portrait) and (pointer:coarse){#rot{display:block}}
@media(orientation:landscape) and (max-height:620px){#tac{position:absolute;left:0;right:0;bottom:6px;padding:0 12px;pointer-events:none;z-index:2}#tac button{pointer-events:auto;opacity:.6}#gu{position:absolute;right:12px;bottom:140px;flex-direction:column}#gu button{width:46px;height:46px;font-size:1.1rem}}
#juego{height:100vh;height:100dvh;width:100vw}#main{min-width:0;min-height:0;overflow:hidden}#cv{max-width:100%;max-height:100%}.astro{width:150px;height:150px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;animation:astroDrift 9s ease-in-out infinite}.astro img{height:100%;width:auto;filter:drop-shadow(0 0 18px rgba(120,170,255,.55)) drop-shadow(0 8px 14px rgba(0,0,0,.6));transform-origin:50% 55%;animation:astroFloat 5.5s ease-in-out infinite}
@keyframes astroFloat{0%{transform:translateY(0) rotate(-7deg) scale(1)}25%{transform:translateY(-9px) rotate(-2deg) scale(1.03)}50%{transform:translateY(-3px) rotate(7deg) scale(1)}75%{transform:translateY(-12px) rotate(3deg) scale(1.04)}100%{transform:translateY(0) rotate(-7deg) scale(1)}}
@keyframes astroDrift{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
@media (prefers-reduced-motion:reduce){.astro,.astro img{animation:none}}
.hero{text-align:center;padding:6px 12px 18px}.hero p{max-width:420px;margin:8px auto 0;text-shadow:0 1px 8px #000}
.hero h1{background:linear-gradient(90deg,#9fc4ff,#fff,#9fc4ff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 0 16px rgba(77,141,255,.6));animation:shm 4s linear infinite}
.orb{position:relative;width:84px;height:84px;margin:0 auto 12px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#f4f4f8,#9aa0b8 60%,#5a5f78);box-shadow:0 0 30px rgba(170,190,255,.5);animation:flt 5s ease-in-out infinite}
.orb:before,.orb:after{content:"";position:absolute;border-radius:50%;background:rgba(70,74,100,.35)}.orb:before{width:20px;height:20px;left:16px;top:42px}.orb:after{width:12px;height:12px;left:50px;top:20px}
.orb i{position:absolute;inset:-14px;border:1px solid rgba(127,176,255,.45);border-radius:50%;animation:spn 7s linear infinite}
.orb i:before{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#7fb0ff;box-shadow:0 0 10px #7fb0ff}
@keyframes spn{to{transform:rotate(360deg)}}@keyframes flt{50%{transform:translateY(-8px)}}@keyframes shm{to{background-position:200% center}}
button{position:relative;overflow:hidden;font-weight:700;letter-spacing:.02em;border-radius:14px;padding:13px 22px;background:linear-gradient(135deg,#3f7bff,#6a4dff);box-shadow:0 4px 0 #2a3f99,0 8px 18px rgba(77,141,255,.35);transition:transform .15s,box-shadow .15s,filter .2s}
button:before{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shn 3.4s infinite}
@keyframes shn{0%,60%{left:-70%}100%{left:130%}}
button:hover{transform:translateY(-2px);filter:brightness(1.12)}button:active{transform:translateY(3px);box-shadow:0 1px 0 #2a3f99}
button.g{background:rgba(20,29,49,.85);box-shadow:0 4px 0 #0b1224}
.sw{padding:0;box-shadow:0 2px 6px rgba(0,0,0,.5);transition:transform .2s}.sw:before{display:none}.sw:hover,.sw.on{transform:scale(1.2)}
#tac button{font-size:.68rem;letter-spacing:0;background:radial-gradient(circle at 30% 25%,#2c3f6e,#141d31);box-shadow:0 3px 0 #0b1224}
#tac button[data-k=left],#tac button[data-k=right],#tac button[data-k=jump]{font-size:1.3rem}
#bgi:after{background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.35) 40%,rgba(0,0,0,.72))!important}
.card{background:rgba(6,10,24,.88)}.sub{color:#dbe5ff}
.hero{background:radial-gradient(ellipse at center,rgba(0,0,0,.6),transparent 72%)}
.hero h1{background:none;-webkit-text-fill-color:#fff;color:#fff;animation:none;filter:none;text-shadow:0 2px 0 #1b2f66,0 0 22px rgba(77,141,255,.95),0 4px 14px #000}
.hero p,#snd{color:#fff;font-weight:500;text-shadow:0 1px 3px #000,0 0 12px #000}
#ox{text-align:left;font-size:.95rem}#pi{margin:0 auto;width:min(300px,78%);height:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.6));animation:sway 6s ease-in-out infinite}@keyframes sway{0%,100%{transform:perspective(700px) rotateY(-14deg)}50%{transform:perspective(700px) rotateY(14deg)}}
.a3 #pi,.a3 #pw,.a3 #pvw{display:none!important}
#lg{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:6;padding:8px 14px;font-size:.95rem}body.ing #lg{right:64px}#vl{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:126px;z-index:6;width:84px;height:36px;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none;background:transparent}body.ing #vl{right:232px}#vl::-webkit-slider-runnable-track{height:6px;border-radius:4px;background:linear-gradient(90deg,#7fb0ff var(--p,85%),#26335a var(--p,85%))}#vl::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5px;border-radius:50%;background:#fff;border:2px solid #4d8dff}#vl::-moz-range-track{height:6px;border-radius:4px;background:#26335a}#vl::-moz-range-progress{height:6px;border-radius:4px;background:#7fb0ff}#vl::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #4d8dff}
#vz{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:72px;z-index:6;padding:8px 12px;font-size:.95rem}body.ing #vz{right:178px}
#btn-portal{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:12px;z-index:10;text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;background:#141d31;border:1px solid #2a3b66;color:#e6ecff;font-weight:600;font-size:.92rem;transition:transform .15s,background .15s;box-shadow:0 4px 12px rgba(0,0,0,.5)}#btn-portal:hover{background:#1d2a47;transform:translateY(-1px);color:#fff}
